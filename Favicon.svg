<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2d5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a6e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#F57C00" stroke-width="12" />
  
  <g filter="url(#glow)" font-family="'Barlow Condensed', 'Segoe UI', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text y="325">
      <!-- Colchete esquerdo -->
      <tspan x="100" fill="#F57C00" font-size="220">[</tspan>
      
      <!-- Menor que -->
      <tspan x="178" fill="#FFFFFF" font-size="200">&lt;</tspan>
      
      <!-- Barra (Exatamente no centro) -->
      <tspan x="256" fill="#FFFFFF" font-size="200">/</tspan>
      
      <!-- Maior que -->
      <tspan x="334" fill="#F57C00" font-size="200">&gt;</tspan>
      
      <!-- Colchete direito -->
      <tspan x="412" fill="#F57C00" font-size="220">]</tspan>
    </text>
  </g>
  
  <rect x="80" y="410" width="352" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="80" y="410" width="176" height="8" rx="4" fill="#F57C00" />
</svg>
